<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relax | Contul tău</title>
    <link rel="icon" href="../assets/Bonus/icon.webp">
    <link rel="stylesheet" href="../index.css"><link rel="stylesheet" href="../styles/account.css">
    <script type="module" src="../scripts/darkTheme.js"></script>
    <script type="module" src="../scripts/account.js"></script>
    <script type="module" src="../scripts/components/NavBar.js"></script>
    <script type="module" src="../scripts/components/EndSection.js"></script>
</head>
<body>
    <nav-bar current-page="account"></nav-bar>
    <div></div>
    <main class="account-settings">
        <h1>Contul tău</h1>
        <p id="account-status" role="status" aria-live="polite">Se încarcă…</p>
        <form id="profile-form" hidden>
            <img id="account-avatar" alt="Avatar">
            <p id="account-email"></p>
            <label for="profile-name">Nume afișat</label>
            <input id="profile-name" name="name" required maxlength="80" autocomplete="nickname">
            <button type="submit">Salvează</button>
            <button type="button" id="sign-out-btn">Deconectează-te</button>
        </form>
        <a id="account-sign-in" hidden>Autentifică-te</a>
    </main>
    <end-section></end-section>
</body>
</html>
